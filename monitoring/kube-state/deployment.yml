apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: kube-state-metrics
  namespace: monitoring 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      app: kube-state-metrics 
  template: 
    metadata: 
      labels: 
        app: kube-state-metrics
    spec: 
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true 
      terminationGracePeriodSeconds: 30 
      securityContext: 
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true 
        
      containers: 
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          imagePullPolicy: IfNotPresent 
          ports: 
            - containerPort: 8080 
          securityContext:
            allowPrivilegeEscalation: false 
            readOnlyRootFilesystem: true 
            capabilities: 
              drop: 
                - ALL 
          resources: 
            requests: 
              cpu: 100m 
              memory: 128Mi 
            limits: 
              cpu: 200m 
              memory: 256Mi 
          livenessProbe: 
            httpGet: 
              path: /healthz
              port: 8080 
            initialDelaySeconds: 10
            periodSeconds: 15 
          readinessProbe: 
            httpGet: 
              path: /healthz
              port: 8080 
            initialDelaySeconds: 10 
            periodSeconds: 10 
          startupProbe: 
            httpGet: 
              path: /healthz 
              port: 8080 
            failureThreshold: 30 
            periodSeconds: 10 
            

      