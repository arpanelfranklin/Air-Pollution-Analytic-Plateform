apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole 
metadata: 
  name: kube-state-metrics

rules: 
  - apiGroups: [""]
    resources: 
      - pods
      - nodes
      - namespaces 
      - services 
      - configmaps
      - persistentvolumes
      - persistentvolumeclaims  
    verbs: 
      - list 
      - watch 
  - apiGroups: 
    - apps
    resources: 
      - deployments 
      - statefulsets 
      - daemonsets 
      - replicasets
    verbs: 
      - list 
      - watch 
  - apiGroups: 
    - batch 
    resources: 
      - jobs 
      - cronjobs 
    verbs: 
      - list 
      - watch 

  