apiVersion: apps/v1 
kind: DaemonSet 
metadata: 
  name: node-exporter
  namespace: monitoring 
spec: 
  
  selector: 
    matchLabels: 
      app: node-exporter 
  template: 
    metadata: 
      labels: 
        app: node-exporter 
    spec: 
      securityContext: 
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true 
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      hostNetwork: true
      hostPID: true
      containers: 
        - name: node-exporter 
          image: prom/node-exporter:v1.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100 
          securityContext: 
            allowPrivilegeEscalation: false 
            readOnlyRootFilesystem: true
            capabilities: 
              drop: 
                - ALL 
          resources: 
            requests: 
              memory: 64Mi 
              cpu: 50m 
            limits: 
              memory: 128Mi 
              cpu: 100m 
          volumeMounts: 
            - name: proc
              mountPath: /host/proc
              readOnly: true 
            - name: sys
              mountPath: /host/sys 
              readOnly: true 
            - name: root 
              mountPath: /rootfs
              readOnly: true 
          args:
            - --path.procfs=/host/proc
            - --path.rootfs=/rootfs
            - --path.sysfs=/host/sys
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

      volumes: 
        - name: proc 
          hostPath: 
            path: /proc
            type: Directory 
        - name: sys
          hostPath: 
            path: /sys 
            type: Directory 
        - name: root
          hostPath: 
            path: /
            

      