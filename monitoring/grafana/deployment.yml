apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: grafana 
  namespace: monitoring 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      app: grafana 
  template: 
    metadata: 
      labels: 
        app: grafana 
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30 
      securityContext: 
        runAsGroup: 65534 
        runAsUser: 65534 
        runAsNonRoot: true 
        fsGroup: 65534 
      containers: 
        - name: grafana 
          image: grafana/grafana:12.1.0
          imagePullPolicy: IfNotPresent 
          ports: 
            - containerPort: 3000
          securityContext: 
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: 
              drop:
                - ALL 
          env: 
            - name: GF_SECURITY_ADMIN_USER 
              valueFrom: 
                secretKeyRef: 
                  name: grafana-secret 
                  key: username 
            - name: GF_SECURITY_ADMIN_PASSWORD 
              valueFrom: 
                secretKeyRef: 
                  name: grafana-secret 
                  key: password 
          resources: 
            requests: 
              cpu: 150m 
              memory: 128Mi 
            limits: 
              cpu: 300m 
              memory: 256Mi
          startupProbe: 
            httpGet: 
              path: /api/health 
              port: 3000 
            periodSeconds: 10 
            failureThreshold: 30 
          livenessProbe: 
            httpGet:
              path: /api/health 
              port: 3000 
            initialDelaySeconds: 5
            periodSeconds: 10 
          readinessProbe: 
            httpGet: 
              path: /api/health 
              port: 3000 
            initialDelaySeconds: 10 
            periodSeconds: 5
          volumeMounts: 
            - name: grafana-storage 
              mountPath: /var/lib/grafana 
      volumes:
        - name: grafana-storage 
          persistentVolumeClaim: 
            claimName: grafana-pvc  

        
      