apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: prometheus-configmap
  namespace: monitoring 
data: 
  prometheus.yml: | 
    global: 
      scrape_interval: 15s 
    scrape_configs: 
      - job_name: prometheus 
        static_configs: 
          targets: 
            - localhost:9090
          labels: 
            app: prometheus 
      - job_name: node-exporter
        static_configs: 
          targets: 
            - node-exporter-service.monitoring.svc.cluster.local:9100
          labels: 
            app: node-exporter 
        